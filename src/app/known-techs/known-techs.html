<section class="mt-28  flex mx-[15%] items-center flex-col relative  ">
  <h2 class="rounded-md backdrop-blur-md text-center  my-15 p-2 text-[22px] md:text-[28px] lg:text-[36px] xl:text-[52px]">Tecnologías conocidas
  </h2>

  <div class="w-full flex flex-col gap-6 items-center  my-20">
    <div class="flex justify-end w-full">
      <select class="select " [(ngModel)]="categoriaSeleccionada" (ngModelChange)="onCategoriaChange($event)">
        <option value="todos">Todos</option>
        <option value="Frontend">Frontend</option>
        <option value="Backend">Backend</option>
        <option value="DB">Database</option>
        <option value="IDE">IDE</option>
        <option value="Game Dev.">Game Dev.</option>
        <option value="Others">Otros</option>

      </select>
    </div>
    <div class="relative w-full md:w-5/6 lg:w-4/6 xl:w-3/6 2xl:w-5/12">
      <div class="relative w-full flex  aspect-square  mx-auto">
        @for (node of nodes; track $index) {
        <button (click)="openModal(node)"
          class="absolute cursor-pointer shadow-[2px_2px_2px_rgba(0,0,0,0.341)] transform -translate-x-1/2 -translate-y-1/2 flex items-center justify-center hover:brightness-125 active:brightness-125 transition-all duration-300"
          [ngClass]="node.fill" [style.left.%]="(node.x / 1000) *120" [style.top.%]="(node.y / 1000) *120"
          [style.width.%]="((node.r * 2) / 1000) *120" [style.height.%]="((node.r * 2) / 1000) *120"
          [style.border-radius]="'50%'" [style.backgroundColor]="'currentColor'"
          [style.border]="strokeSize + 'px solid #ffffff33'" [attr.title]="node.name + ' - ' + node.tipo">
          <img [src]="node.url" [alt]="node.name" class="w-7/12 h-2/3 object-contain pointer-events-none" />
        </button>


        }
      </div>
    </div>
  </div>
</section>

<dialog #techModal class="modal">
  <div class="modal-box  overflow-hidden">
    <div method="dialog" class="modal-backdrop relative flex flex-col h-full mx-auto text-black">
      <button (click)="closeModal()" class="btn btn-sm btn-circle btn-ghost absolute right-0 top-0">✕</button>

      <div
        class="mx-auto w-[80%] flex flex-col gap-2 items-center justify-center  font-bold uppercase mask-[linear-gradient(to_right,transparent,black_10%,black_90%,transparent)] border-b pb-4">
        <img class="w-20 md:w-30" src="{{usedTech?.url}}" alt="{{usedTech?.name}}">
        {{usedTech?.name}}
      </div>
      <div [innerHTML]="usedTech?.descripcion" class="mt-4 text-[14px] md:text-[16px]">

      </div>
      <img class="w-20 md:w-30 absolute opacity-20  left-[37%] top-1/2" src="{{usedTech?.url}}"
        alt="{{usedTech?.name}}">

    </div>
  </div>
</dialog>
